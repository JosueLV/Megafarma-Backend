spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
app:
  demo:
    enabled: false
  bootstrap:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
